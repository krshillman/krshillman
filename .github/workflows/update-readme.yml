name: Update profile

# Builds one combined view of the personal (krshillman) and work
# (chhillman-uom) accounts with scripts/profilegen:
#   * SVG cards  -> force-pushed as a single commit to the `profile-assets`
#                   branch, so main doesn't collect a bot commit per run
#   * README.md  -> "Recent activity" and "Latest writing" sections, committed
#                   to main only when their content actually changes
#
# Secrets (classic PATs with `repo` + `read:user`, each created by the
# account it reports on; see scripts/README.md):
#   METRICS_TOKEN -> krshillman      WORK_TOKEN -> chhillman-uom

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/profile.toml"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    name: Build combined profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -t scripts

      - name: Generate cards and README sections
        env:
          PERSONAL_TOKEN: ${{ secrets.METRICS_TOKEN }}
          WORK_TOKEN: ${{ secrets.WORK_TOKEN }}
        run: python -m profilegen --config .github/profile.toml --out dist --readme README.md

      - name: Publish cards to the profile-assets branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/README.md <<'EOF'
          # profile-assets

          Generated by `.github/workflows/update-readme.yml` and force-pushed as a
          single commit on every run. Do not edit by hand.
          EOF
          cd dist
          git init -q -b profile-assets
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update profile cards"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:profile-assets

      - name: Commit README if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile activity [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }
